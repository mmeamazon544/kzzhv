# Superseded by family.yml (which carries Ari and the whole family on the
# Friday 6:00 am schedule). Kept only so old links to this workflow do not
# break; it has no schedule and simply points at the replacement.
name: ari (superseded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use the 'family' workflow (member ari)." | tee -a "$GITHUB_STEP_SUMMARY"
