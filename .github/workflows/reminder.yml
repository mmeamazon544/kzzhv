# The evening nudge (build order step 7): on the eve of the mailing day —
# Thursday night for a plain Shabbat — if the week's proof is still
# unapproved, Marc gets the links again. Runs every day at 4:00 pm New
# York nominal (GitHub queues it hours late, so it lands in the evening);
# publish.py --remind speaks only when today is that eve and the bulletin
# is still merely proofed.
name: reminder

on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          # Identify the run by WHICH cron fired: the 20:00 UTC one on EDT,
          # the 21:00 UTC one on EST. Exactly one matches each day, however
          # long the queue delay. Edit the wants with the crons.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(TZ=America/New_York date +%z)" in
              -0400) want="0 20 * * *" ;;
              *)     want="0 21 * * *" ;;
            esac
            if [ -n "$FIRED" ]; then
              if [ "$FIRED" != "$want" ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "cron '$FIRED' is not New York's 4 pm cron today ('$want')"
                exit 0
              fi
            else
              h=$(TZ=America/New_York date +%H)
              if [ "$h" -lt 16 ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "no cron string, and ${h}:00 New York is before the evening window"
                exit 0
              fi
            fi
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

  remind:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          PRIVATE_PAGE_PASSWORD: ${{ secrets.PRIVATE_PAGE_PASSWORD }}
        run: python3 program/publish.py --remind | tee -a "$GITHUB_STEP_SUMMARY"
