# The 5:00 pm Wednesday nudge (build order step 7): if the week's proof is
# still unapproved an hour before sending time, Marc gets the links again.
name: reminder

on:
  schedule:
    - cron: "0 21 * * 3"
    - cron: "0 22 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          # GitHub queues cron runs hours late, so the old "is it exactly 17
          # in New York" test never passed and the nudge never arrived.
          # Identify the run by WHICH cron fired instead: the 21:00 UTC one
          # on EDT, the 22:00 UTC one on EST. Exactly one matches each
          # Wednesday, however long the queue delay.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(TZ=America/New_York date +%z)" in
              -0400) want="0 21 * * 3" ;;
              *)     want="0 22 * * 3" ;;
            esac
            if [ -n "$FIRED" ]; then
              if [ "$FIRED" != "$want" ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "cron '$FIRED' is not New York's 5 pm cron today ('$want')"
                exit 0
              fi
            else
              h=$(TZ=America/New_York date +%H)
              if [ "$h" -lt 17 ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "no cron string, and ${h}:00 New York is before the evening window"
                exit 0
              fi
            fi
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

  remind:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          PRIVATE_PAGE_PASSWORD: ${{ secrets.PRIVATE_PAGE_PASSWORD }}
        run: python3 program/publish.py --remind | tee -a "$GITHUB_STEP_SUMMARY"
