# Make a family member's letter their only mailing: take that family
# segment's members off the congregational Weekly segment (tag and
# membership), leaving their own tag alone. No address ever appears in
# code, inputs, or logs. Manually triggered; a dry run unless apply=true.
name: mailchimp-private

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Family segment key (ari | misha | gabi | mom)"
        required: true
        default: "mom"
      apply:
        description: "true = make the change; anything else only reports"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  private:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          set -o pipefail
          APPLY=""
          [ "${{ inputs.apply }}" = "true" ] && APPLY="--apply"
          python3 program/mailchimp_private.py --segment "${{ inputs.segment }}" $APPLY | tee -a "$GITHUB_STEP_SUMMARY"
