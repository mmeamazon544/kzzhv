# Publication (build order step 7). An Approve click — from the proof email
# or from the Desk at kzzhv.org/private — dispatches here and is recorded.
# Publication happens on the bulletin's mailing day: the Friday before a
# plain Shabbat, the first eve of a festival cluster when that comes
# earlier (Marc's rule, 15 November 2026; program/schedule.py). This runs
# every day at 6:00 am and again at 10:00 am New York (two cron pairs, one
# per daylight-saving state; GitHub queues them hours late) and lets
# publish.py --if-due decide: it publishes and sends only an approved
# bulletin whose send moment has come, and does nothing twice. An approval
# that arrives after the send moment publishes and sends at once.
# Publishing commits the proofed page to the site (the push deploys it)
# and then sends the email — to the Proof segment only, until the
# repository variable BULLETIN_DRY_RUN is set to "false".
name: publish

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  repository_dispatch:
    types: [bulletin-approve]
  workflow_dispatch:

permissions:
  contents: write

concurrency: bulletin

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          # Identify the run by WHICH cron fired (a queue delay cannot
          # change that string): on EDT the 10:00 and 14:00 UTC crons are
          # New York's 6 am and 10 am, on EST the 11:00 and 15:00 ones. The
          # other pair is rejected. Two runs a day are safe because
          # publish.py --if-due publishes and sends nothing twice; the
          # second run is the safety net for a first one queued very late.
          # If a cron above is ever edited, edit the wants here too.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(TZ=America/New_York date +%z)" in
              -0400) want1="0 10 * * *"; want2="0 14 * * *" ;;
              *)     want1="0 11 * * *"; want2="0 15 * * *" ;;
            esac
            if [ -n "$FIRED" ]; then
              if [ "$FIRED" != "$want1" ] && [ "$FIRED" != "$want2" ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "cron '$FIRED' is not one of New York's crons today ('$want1', '$want2')"
                exit 0
              fi
            else
              h=$(TZ=America/New_York date +%H)
              if [ "$h" -lt 6 ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "no cron string, and ${h}:00 New York is before the morning window"
                exit 0
              fi
            fi
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record approval
        if: github.event_name == 'repository_dispatch'
        run: |
          set -o pipefail
          git config user.name "kkzz-bulletin"
          git config user.email "shabbat@kzzhv.org"
          python3 program/publish.py --record-approval "${{ github.event.client_payload.id }}" "${{ github.event.client_payload.rev }}" | tee rec.log -a "$GITHUB_STEP_SUMMARY"
          git add bulletin/state/current.json
          git commit -m "Approve ${{ github.event.client_payload.id }}" || true
          git pull --rebase origin main
          git push
      - name: Publish and send when due
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          BULLETIN_DRY_RUN: ${{ vars.BULLETIN_DRY_RUN }}
        run: |
          set -o pipefail
          git config user.name "kkzz-bulletin"
          git config user.email "shabbat@kzzhv.org"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 program/publish.py --publish | tee pub.log -a "$GITHUB_STEP_SUMMARY"
          else
            python3 program/publish.py --publish --if-due | tee pub.log -a "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q "^published" pub.log; then
            git add -f site/bulletin
            git add site/services.html
            git add bulletin
            git commit -m "Publish $(python3 -c "import json;print(json.load(open('bulletin/state/current.json'))['id'])")"
            git pull --rebase origin main
            git push
          fi
          # Send after a fresh publication, and also pick up a bulletin that
          # was published earlier but whose send did not complete; an
          # already-sent bulletin prints "already sent" and nothing moves.
          if grep -qE "^(published|already published)" pub.log; then
            python3 program/publish.py --send | tee -a "$GITHUB_STEP_SUMMARY"
            if ! git diff --quiet bulletin/state/current.json; then
              git add bulletin/state/current.json
              git commit -m "Record send"
              git pull --rebase origin main
              git push
            fi
          fi
