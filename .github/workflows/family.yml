# The family emails: Ari (Tufts), Misha and Hannah (Philadelphia), Gabi
# and Pascale (Philadelphia), Mom (NYC). Each to its own tag segment.
# Runs daily at 6:00 am New York; family.py --auto sends only on Fridays
# and on festival eves (never on Shabbat or yom tob itself), to the
# members named in the repository variable FAMILY_ARMED.
name: family

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      member:
        description: "ari | misha | gabi | mom | armed"
        required: true
        default: "armed"
      mode:
        description: "proof (to Marc) or live"
        required: true
        default: "proof"
      shabbat:
        description: "Shabbat date (YYYY-MM-DD); empty = next Saturday"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          # GitHub queues cron runs late — hours late, every single day —
          # so the old "is it exactly 06 in New York" test never passed and
          # no scheduled letter ever went out. Identify the run by WHICH
          # cron fired instead: the 10:00 UTC one while New York is on EDT,
          # the 11:00 UTC one while it is on EST. Exactly one matches each
          # day, however long the queue delay.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(TZ=America/New_York date +%z)" in
              -0400) want="0 10 * * *" ;;
              *)     want="0 11 * * *" ;;
            esac
            if [ -n "$FIRED" ]; then
              if [ "$FIRED" != "$want" ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "cron '$FIRED' is not New York's 6 am cron today ('$want')"
                exit 0
              fi
            else
              h=$(TZ=America/New_York date +%H)
              if [ "$h" -lt 6 ] || [ "$h" -ge 15 ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "no cron string, and ${h}:00 New York is outside the morning window"
                exit 0
              fi
            fi
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          FAMILY_ARMED: ${{ vars.FAMILY_ARMED }}
        working-directory: program
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 family.py --live --auto | tee -a "$GITHUB_STEP_SUMMARY"
          else
            MODE="--proof"
            [ "${{ inputs.mode }}" = "live" ] && MODE="--live"
            python3 family.py $MODE --member "${{ inputs.member }}" ${{ inputs.shabbat }} | tee -a "$GITHUB_STEP_SUMMARY"
          fi
