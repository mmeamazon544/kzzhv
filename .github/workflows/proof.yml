# The proof (build order step 7). Runs every day at 10:00 am New York —
# both candidate UTC hours; the gate keeps the one that is 10 am today —
# and asks program/schedule.py whether today is a proof day: the day before
# a bulletin's first eve, so Thursday for a plain Shabbat, earlier on a
# festival week, and the day before the eve of a festival or fast that has
# a bulletin of its own (Marc's rules, 15 November 2026). GitHub queues these
# crons hours late, which is why the nominal hour is 10 am: the proof lands
# in Marc's hands during Thursday afternoon or evening, in time for his
# review that night. Also runs on a Request-changes dispatch from the site,
# or by hand. Builds the bulletin, stores it under bulletin/state/<id>/,
# commits, then mails the proof — always and only to the Proof segment
# (Marc). The Desk at kzzhv.org/private shows the same proof.
name: proof

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      shabbat:
        description: "Bulletin id (a Saturday, or a standalone festival's first day); empty = the next one"
        required: false
        default: ""
      keep_teachings:
        description: "true = re-render with the divrei torah already drafted, do not write new ones"
        required: false
        default: "false"
  repository_dispatch:
    types: [bulletin-changes]

permissions:
  contents: write

concurrency: bulletin

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          # GitHub queues cron runs hours late, so a wall-clock test never
          # passes. Identify the run by WHICH cron fired instead: the 14:00
          # UTC one on EDT, the 15:00 UTC one on EST. Exactly one matches
          # each day, however long the queue delay. If a cron above is ever
          # edited, edit its "want" here in the same commit.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(TZ=America/New_York date +%z)" in
              -0400) want="0 14 * * *" ;;
              *)     want="0 15 * * *" ;;
            esac
            if [ -n "$FIRED" ]; then
              if [ "$FIRED" != "$want" ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "cron '$FIRED' is not New York's 10 am cron today ('$want')"
                exit 0
              fi
            else
              h=$(TZ=America/New_York date +%H)
              if [ "$h" -lt 10 ] || [ "$h" -ge 22 ]; then
                echo "go=no" >> "$GITHUB_OUTPUT"
                echo "no cron string, and ${h}:00 New York is outside the daytime window"
                exit 0
              fi
            fi
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

  proof:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide the bulletin and any instructions
        id: decide
        env:
          PAYLOAD_ID: ${{ github.event.client_payload.id }}
          PAYLOAD_REV: ${{ github.event.client_payload.rev }}
          INPUT_SHABBAT: ${{ inputs.shabbat }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            CUR_REV=$(python3 -c "import json;print(json.load(open('bulletin/state/current.json'))['rev'])" 2>/dev/null || echo "")
            if [ "$PAYLOAD_REV" != "$CUR_REV" ]; then
              echo "stale change-request (rev $PAYLOAD_REV vs current $CUR_REV); ignoring"
              echo "id=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "id=$PAYLOAD_ID" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SHABBAT" ]; then
            echo "id=$INPUT_SHABBAT" >> "$GITHUB_OUTPUT"
          else
            # Every day asks; only the proof day answers with an id.
            ID=$(python3 program/schedule.py --proof-today)
            if [ -z "$ID" ]; then
              echo "today is not a proof day; nothing to build"
              python3 program/schedule.py
              echo "id=" >> "$GITHUB_OUTPUT"; exit 0
            fi
            CUR_ID=$(python3 -c "import json;print(json.load(open('bulletin/state/current.json'))['id'])" 2>/dev/null || echo "")
            if [ "$ID" = "$CUR_ID" ]; then
              STATUS=$(python3 -c "import json;print(json.load(open('bulletin/state/current.json')).get('status',''))")
              BUILT=$(python3 -c "import json;print(json.load(open('bulletin/state/current.json')).get('proofed_at','')[:8])")
              TODAY=$(TZ=America/New_York date +%Y%m%d)
              if [ "$STATUS" = "proofed" ] && [ -n "$BUILT" ] && [ "$BUILT" \< "$TODAY" ]; then
                # Built ahead of its day and still unapproved: refresh it so
                # announcements and times saved since are in the proof Marc
                # reviews tonight, keeping the divrei torah he may have read.
                echo "a proof for $ID was built early ($BUILT) and is unapproved; refreshing it with today's content files, same divrei torah"
                echo "id=$ID" >> "$GITHUB_OUTPUT"
                echo "keep=true" >> "$GITHUB_OUTPUT"
              else
                echo "a proof for $ID already exists ($STATUS); not rebuilding"
                echo "id=" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "id=$ID" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install the build tools
        if: steps.decide.outputs.id != ''
        run: |
          set -o pipefail
          pip install anthropic playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build the proof
        if: steps.decide.outputs.id != ''
        working-directory: program
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIVATE_PAGE_PASSWORD: ${{ secrets.PRIVATE_PAGE_PASSWORD }}
          INSTRUCTIONS: ${{ github.event.client_payload.instructions }}
        run: |
          set -o pipefail
          KEEP=""
          if [ "${{ inputs.keep_teachings }}" = "true" ] || [ "${{ steps.decide.outputs.keep }}" = "true" ]; then
            KEEP="--keep-teachings"
          fi
          if [ -n "$INSTRUCTIONS" ]; then
            python make_proof.py "${{ steps.decide.outputs.id }}" $KEEP --instructions "$INSTRUCTIONS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python make_proof.py "${{ steps.decide.outputs.id }}" $KEEP | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit the proof state
        if: steps.decide.outputs.id != ''
        run: |
          set -o pipefail
          git config user.name "kkzz-bulletin"
          git config user.email "shabbat@kzzhv.org"
          # Content-file edits from a change request commit with the state.
          # The Keter Shem Tob page-offset cache is kept too: a week that
          # consults a volume not yet probed rewrites it, and left behind
          # as an unstaged change it made "git pull --rebase" refuse and
          # killed the run before the proof was mailed — five of the seven
          # Wednesdays from 30 September to 11 November 2026.
          git add bulletin program/data/kst-offsets.json
          git commit -m "Proof ${{ steps.decide.outputs.id }}"
          # Whatever else the build touched — the page render under site/,
          # any other cache — is incidental. Show it in the log, then drop
          # it, so the rebase always starts clean.
          echo "left behind by the build (discarded):"
          git status --porcelain
          git checkout -- .
          git clean -fd
          git pull --rebase origin main
          git push
      - name: Send the proof to Marc
        if: steps.decide.outputs.id != ''
        working-directory: program
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          PRIVATE_PAGE_PASSWORD: ${{ secrets.PRIVATE_PAGE_PASSWORD }}
        run: python make_proof.py --send-only | tee -a "$GITHUB_STEP_SUMMARY"
